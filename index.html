<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Car Care | Enlaces</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">
        
        <div class="profile-container">
            <div class="logo-circle">
                <span class="logo-placeholder">EC</span>
            </div>
            <h1 class="brand-name">Element Car Care</h1>
            <p class="brand-subtitle">Detallado Automotriz Profesional</p>
        </div>

        <div class="links-menu">
            <a href="https://wa.me/523326198870" class="link-btn" target="ElementCarCareWhatsApp">
                <i class="fa-brands fa-whatsapp"></i>
                <span>Agendar por WhatsApp</span>
            </a>

            <a href="servicios.html" class="link-btn">
                <i class="fas fa-car"></i>
                <span>Servicios</span>
            </a>

            <a href="#" class="link-btn" target="_blank">
                <i class="fa-solid fa-map-marker-alt"></i>
                <span>Nuestra Ubicación</span>
            </a>
        </div>

        <div class="portfolio-section">
            <h2 class="section-title">Nuestro Trabajo</h2>
            <div class="portfolio-grid">
                
                <div class="portfolio-item">
                    <div class="image-circle">
                        <img src="20260606_123605.jpg" class="galeria-img" alt="Detallado con espuma activa">
                    </div>
                    <span>Detallado</span>
                </div>

                <div class="portfolio-item">
                    <div class="image-circle">
                        <img src="20260510_115618.jpg" class="galeria-img" alt="Protección y corrección de pintura">
                    </div>
                    <span>Protección</span>
                </div>

                <div class="portfolio-item">
                    <div class="image-circle">
                        <img src="20260510_110039.jpg" class="galeria-img" alt="Limpieza profunda de rines">
                    </div>
                    <span>Rines</span>
                </div>

            <div id="custom-modal" class="modal-overlay">
                <span class="modal-close">&times;</span>
                <img class="modal-content" id="modal-image" src="" alt="Imagen ampliada">
            </div>

            <script src="script.js"></script>

            </div>
        </div>

        <footer class="footer-links">
            <a href="#" target="_blank">Instagram</a>
            <a href="#" target="_blank">TikTok</a>
        </footer>

    </div>

</body>
</html>
